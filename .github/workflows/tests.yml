name: Python package

on:
  push:
    branches: [v2-development]
  pull_request:
    branches: [v2-development]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tooling
        run: python -m pip install . build
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import self_debrid; from self_debrid.application.search import SearchService; from self_debrid.providers.torznab import TorznabProvider; from self_debrid.adapters.stremio.http import create_app; from self_debrid.adapters.stremio.streams import candidate_to_stream; from self_debrid.metadata.cinemeta import CinemetaResolver"
          python -c "from self_debrid.application.playback import PlaybackService; from self_debrid.application.torrent_client import TorrentClient; from self_debrid.adapters.qbittorrent import QBittorrentClient; from self_debrid.domain.file_selection import select_video_file; from self_debrid.infrastructure.torrent_engine import open_torrent_engine"
          python -m self_debrid --help
          self-debrid --version
          self-debrid serve --help
          self-debrid doctor --help
