[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "self-debrid"
version = "2.0.0.dev1"
description = "Self-Debrid discovery and native Stremio torrent addon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.10,<4", "defusedxml>=0.7.1,<1"]

[project.scripts]
self-debrid = "self_debrid.__main__:main"

[tool.setuptools.packages.find]
include = ["self_debrid*"]
